[project]
name = "survey-service"
version = "0.1.0"
description = "Survey lifecycle service for Enterprise Survey AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.19.0",
    "greenlet>=3.5.4",
    "pyjwt>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "openai>=1.61.0",
    "langchain-core>=0.3.40",
    "langchain-openai>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.1",
    "ruff>=0.12.7",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

services:
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
      - ./infrastructure/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./infrastructure/postgres/backups:/backups
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - backend-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend-network


  qdrant:

    image: qdrant/qdrant:v1.15.4

    container_name: qdrant

    hostname: qdrant

    restart: unless-stopped

    ports:

      - "${QDRANT_PORT}:6333"

      - "${QDRANT_GRPC_PORT}:6334"

    volumes:

      - qdrant-data:/qdrant/storage

      - ./infrastructure/qdrant/config.yaml:/qdrant/config/production.yaml

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:6333/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network


  ollama:

    image: ollama/ollama:0.11.6

    container_name: ollama

    hostname: ollama

    restart: unless-stopped

    ports:

      - "${OLLAMA_PORT}:11434"

    volumes:

      - ollama-data:/root/.ollama

    healthcheck:

      test:

        [

          "CMD",

          "ollama",

          "list"

        ]

      interval: 30s

      timeout: 10s

      retries: 5

    networks:

      - backend-network

  minio:

    image: minio/minio:RELEASE.2025-07-23T15-54-02Z

    container_name: minio

    hostname: minio

    restart: unless-stopped

    ports:

      - "${MINIO_API_PORT}:9000"

      - "${MINIO_CONSOLE_PORT}:9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:

      - minio-data:/data

    healthcheck:

      test:

        [

          "CMD",

          "curl",

          "-f",

          "http://localhost:9000/minio/health/live"

        ]

      interval: 30s

      timeout: 20s

      retries: 5

    networks:

      - backend-network


  traefik:

    image: traefik:v3.5

    container_name: traefik

    hostname: traefik

    restart: unless-stopped

    ports:

      - "${TRAEFIK_HTTP_PORT}:80"

      - "${TRAEFIK_DASHBOARD_PORT}:8080"

    command:

      - "--configFile=/etc/traefik/traefik.yml"

    volumes:

      - /var/run/docker.sock:/var/run/docker.sock:ro

      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml

      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml

    healthcheck:

      test:

        [

          "CMD",

          "wget",

          "--spider",

          "-q",

          "http://localhost:8080/ping"

        ]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:

      - backend-network